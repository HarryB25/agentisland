        <rect x="0.75" y="0.75" width="342.5" height="32.5" rx="13.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
        <text x="22" y="22" fill="#F6F1E7" fill-opacity="0.72" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">SwiftUI notch surface · compact, peek, expanded</text>
