    <path d="M988 340H1038" stroke="#D2B044" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowWarm)"/>
    <path d="M1066 566H1006" stroke="#67D98C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCool)"/>
    <path d="M1192 660V706C1192 728 1174 746 1152 746H770C726 746 692 712 692 668V638" stroke="#67D98C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowCool)"/>
