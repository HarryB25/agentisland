      <text x="30" y="78" fill="#F6F1E7" fill-opacity="0.52" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Anything that can write state or call the CLI.</text>

      <g transform="translate(22 118)">
        <rect width="304" height="84" rx="22" fill="url(#softCard)"/>
        <rect x="0.75" y="0.75" width="302.5" height="82.5" rx="21.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
