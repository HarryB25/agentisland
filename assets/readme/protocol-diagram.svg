      <text x="32" y="84" fill="#F6F1E7" fill-opacity="0.52" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Native app + local store + reply loop</text>

