        <rect width="344" height="118" rx="24" fill="url(#replyCard)"/>
        <rect x="0.75" y="0.75" width="342.5" height="116.5" rx="23.25" stroke="#67D98C" stroke-opacity="0.28" stroke-width="1.5"/>
        <text x="22" y="34" fill="#F6F1E7" fill-opacity="0.90" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Reply channel</text>
        <text x="22" y="60" fill="#F6F1E7" fill-opacity="0.58" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">`~/.agentisland/replies/&lt;agent&gt;/`</text>
        <text x="22" y="86" fill="#F6F1E7" fill-opacity="0.46" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">approve, deny, option, dismiss,</text>
