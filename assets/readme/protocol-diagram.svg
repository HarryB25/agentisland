        <text x="22" y="52" fill="#F6F1E7" fill-opacity="0.54" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">scripts, SDKs, local automation</text>
