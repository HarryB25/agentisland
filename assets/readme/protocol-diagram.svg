        <text x="22" y="58" fill="#F6F1E7" fill-opacity="0.54" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">hooks → session and tool events</text>
      </g>

      <g transform="translate(22 216)">
