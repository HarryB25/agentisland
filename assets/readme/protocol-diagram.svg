        <text x="22" y="86" fill="#F6F1E7" fill-opacity="0.46" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">running, waiting_input, done, error,</text>
        <text x="22" y="104" fill="#F6F1E7" fill-opacity="0.46" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">progress, phase, actions</text>
      </g>

