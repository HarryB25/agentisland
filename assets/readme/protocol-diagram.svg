      <rect x="0.75" y="0.75" width="250.5" height="186.5" rx="27.25" stroke="#D7B44A" stroke-opacity="0.22" stroke-width="1.5"/>
      <text x="28" y="48" fill="#F6F1E7" fill-opacity="0.95" font-size="26" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">CLI</text>
      <text x="28" y="76" fill="#F6F1E7" fill-opacity="0.52" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Writers and readers</text>
      <text x="28" y="120" fill="#F6F1E7" fill-opacity="0.84" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">`agentisland report`</text>
      <text x="28" y="148" fill="#F6F1E7" fill-opacity="0.84" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">`agentisland wait`</text>
    </g>

    <g transform="translate(1066 472)">
      <rect width="252" height="188" rx="28" fill="url(#panel)"/>
      <rect x="0.75" y="0.75" width="250.5" height="186.5" rx="27.25" stroke="#67D98C" stroke-opacity="0.22" stroke-width="1.5"/>
      <text x="28" y="48" fill="#F6F1E7" fill-opacity="0.95" font-size="26" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">You</text>
      <text x="28" y="76" fill="#F6F1E7" fill-opacity="0.52" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Decision back into the loop</text>
      <text x="28" y="122" fill="#F6F1E7" fill-opacity="0.84" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Approve</text>
      <text x="28" y="150" fill="#F6F1E7" fill-opacity="0.84" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Deny</text>
      <text x="28" y="178" fill="#F6F1E7" fill-opacity="0.84" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Choose an option</text>
    </g>

