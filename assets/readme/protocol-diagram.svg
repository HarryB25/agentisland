        <rect x="0.75" y="0.75" width="302.5" height="82.5" rx="21.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
        <text x="22" y="34" fill="#F6F1E7" fill-opacity="0.92" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Codex</text>
        <text x="22" y="58" fill="#F6F1E7" fill-opacity="0.54" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">OTLP logs + transcript fallback</text>
