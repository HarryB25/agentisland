    <rect x="120.75" y="96.75" width="1358.5" height="666.5" rx="39.25" stroke="#E8DCC3" stroke-width="1.5"/>

    <text x="186" y="168" fill="#171717" fill-opacity="0.92" font-size="42" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">How AgentIsland works</text>
    <text x="186" y="206" fill="#171717" fill-opacity="0.52" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">Small local files in. Native notch UI out. Replies flow back through the same protocol.</text>

    <g transform="translate(186 254)">
